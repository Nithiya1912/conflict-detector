# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: conflict-detector
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: none
